<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Not Found</title>
<script>try { document.documentElement.dataset.theme = localStorage.getItem("theme") || "light"; } catch (e) {}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/base.css">
<style>
  body {
    min-height: 100vh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 20px; padding: 24px; text-align: center;
  }
  .code { font-size: clamp(72px, 18vw, 140px); font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
  .code span { color: var(--accent); }
  h1 { font-size: clamp(18px, 4vw, 24px); font-weight: 700; }
  p { color: var(--ink-soft); font-size: 15px; font-weight: 500; max-width: 360px; }
  .btn { margin-top: 8px; }
</style>
</head>
<body>
  <div class="code">4<span>0</span>4</div>
  <h1>Page not found</h1>
  <p>The page you're looking for doesn't exist or has moved.</p>
  <a class="btn" href="/">Back to home</a>
</body>
</html>
